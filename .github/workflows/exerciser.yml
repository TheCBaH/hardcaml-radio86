name: exerciser
# 8080EX1 on the emitted Verilog under Verilator: about half an hour, so only when the RTL changes.
on:
  push:
    paths:
      - 'local/rtl/**'
      - 'local/verilog/**'
      - 'local/scripts/exerciser-test.sh'
      - '.github/workflows/exerciser.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: exerciser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exerciser:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Free runner disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Authenticate image cache
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Development container
        uses: TheCBaH/devcontainer-action/devcontainer@v1
        id: container
        env:
          OCAML_VERSION: '5.4.1'
        with:
          cli-version: '0.88.0'
          post-create: 'false'
          variant: '5.4.1'
          platform: linux/arm64
      - name: 8080EX1 on the emitted Verilog
        run: ${{ steps.container.outputs.exec }} make exerciser-test
      - name: Console
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: exerciser
          path: |
            out/exerciser/*.txt
            out/exerciser/*.log
          if-no-files-found: warn
